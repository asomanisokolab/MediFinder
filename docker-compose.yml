services:
  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MEDIFINDER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MEDIFINDER_JWT_SECRET: ${MEDIFINDER_JWT_SECRET:?Set MEDIFINDER_JWT_SECRET in .env}
      MEDIFINDER_RATE_LIMIT: ${MEDIFINDER_RATE_LIMIT:-120}
      MEDIFINDER_DATA_VERIFIED: ${MEDIFINDER_DATA_VERIFIED:-false}
      MEDIFINDER_PUBLIC_URL: ${MEDIFINDER_PUBLIC_URL:-https://${DOMAIN}}
      MEDIFINDER_GA_MEASUREMENT_ID: ${MEDIFINDER_GA_MEASUREMENT_ID:-}
      MEDIFINDER_GOOGLE_VERIFICATION_FILE: ${MEDIFINDER_GOOGLE_VERIFICATION_FILE:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
