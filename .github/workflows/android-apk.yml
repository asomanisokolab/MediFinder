name: Android APK

# Builds an installable APK of the FindCare Ghana Expo app on GitHub, with no
# Expo account needed. Download it from the run's "Artifacts" section.
# (With an Expo account you can also run `eas build -p android --profile preview`.)
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check types and lint
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # Release build: optimized and runs without a dev server. Expo signs it
      # with the debug key, which is fine for installing and testing but not
      # for the Play Store (use `eas build --profile production` for that).
      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: findcare-ghana-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
