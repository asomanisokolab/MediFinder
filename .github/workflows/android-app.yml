name: Android app

# Builds the FindCare Ghana Android app (public pages only) whenever the app
# or the public website pages change. Download the result from the run's
# "Artifacts" section.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "frontend/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Build the public pages and copy them into Android
        run: npm run sync

      - name: Build the installable test APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: findcare-ghana-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      # Play Store build. Runs only once the signing secrets are set up
      # (see mobile/README.md).
      - name: Load the signing key
        id: key
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build the signed Play Store bundle
        if: ${{ steps.key.outputs.path != '' }}
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        if: ${{ steps.key.outputs.path != '' }}
        with:
          name: findcare-ghana-play-store-bundle
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
